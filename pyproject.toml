[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ndapuspeech"
version = "0.1.0"
description = "Open ASR for the Wolof language (NdapuSpeech), beating M-Kiriku baseline"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
audio = [
    "torch",
    "torchaudio",
    "transformers",
    "datasets",
    "peft",
    "sentencepiece",
    "jiwer",
    "soundfile",
    "librosa",
    "yt-dlp",
    "tqdm",
    "pyloudnorm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ARG", "RUF"]
ignore = ["B024", "B027"]

[tool.ruff.lint.isort]
known-first-party = ["ndapuspeech"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"